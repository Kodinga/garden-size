<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#16261c" />
    <meta name="description" content="Measure the area of your garden by walking its edge with your phone's GPS, drawing it on a satellite map, or (in France) from the cadastre." />
    <title>Garden Size</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- English text below is the fallback; app.js swaps in the chosen language (see i18n.js). -->
    <div id="map" aria-label="Map"></div>

    <button id="locate-btn" class="fab" data-i18n-title="locate" title="Centre on my location" aria-label="Centre on my location">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="currentColor"/><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 1v3M12 20v3M1 12h3M20 12h3" stroke="currentColor" stroke-width="2"/></svg>
    </button>

    <button id="imagery-btn" class="fab fab-2" data-i18n-title="imagery.btn" title="Imagery dates: find older photos, e.g. winter without leaves" aria-label="Choose imagery date">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3 10h18M8 3v4M16 3v4" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="15.5" r="2.2" fill="currentColor"/></svg>
    </button>

    <div id="imagery-bar" hidden>
      <button id="img-older" data-i18n-title="imagery.older" title="Older imagery" aria-label="Older imagery">◀</button>
      <select id="img-select" data-i18n-title="imagery.select" aria-label="Imagery date"></select>
      <button id="img-newer" data-i18n-title="imagery.newer" title="Newer imagery" aria-label="Newer imagery">▶</button>
      <button id="img-close" data-i18n-title="imagery.close" title="Back to latest imagery" aria-label="Back to latest imagery">✕</button>
    </div>

    <div id="toast" role="status" aria-live="polite"></div>

    <dialog id="loc-help" aria-labelledby="loc-help-title">
      <h2 id="loc-help-title">Location is blocked</h2>
      <p class="muted" id="loc-help-sub"></p>
      <ol id="loc-help-steps"></ol>
      <div class="row">
        <button id="loc-retry" class="primary" data-i18n="help.retry">Try again</button>
        <button id="loc-reload" data-i18n="help.reload">Reload page</button>
        <button id="loc-close" data-i18n="help.close">Close</button>
      </div>
      <p class="muted" data-i18n-html="help.noGps">You can still measure without GPS: use <b>Draw on map</b>.</p>
    </dialog>

    <section id="panel">
      <div class="stats">
        <div class="area-label" id="area-label" hidden></div>
        <div class="area-main" id="area-main">—</div>
        <div class="area-sub" id="area-sub" data-i18n="start.hint">Walk or draw your garden's edge</div>
        <div class="meta">
          <span id="perimeter"></span>
          <span class="dot">·</span>
          <span id="point-count"></span>
          <span id="cadastre-info" class="uncertainty"></span>
          <span id="uncertainty" class="uncertainty"></span>
        </div>
        <div id="warning" class="warning" hidden></div>
      </div>

      <div class="areas">
        <ul id="area-list" aria-label="Areas"></ul>
        <button id="add-area-btn" class="add-area" data-i18n="areas.add">＋ New area</button>
      </div>

      <div class="modes" role="tablist">
        <button class="mode" data-mode="walk" role="tab" aria-selected="false" data-i18n="mode.walk">🚶 Walk the edge</button>
        <button class="mode" data-mode="draw" role="tab" aria-selected="false" data-i18n="mode.draw">✏️ Draw on map</button>
        <button class="mode" data-mode="parcel" role="tab" aria-selected="false" data-i18n="mode.parcel" hidden>🏠 Parcel</button>
      </div>

      <div id="walk-controls" class="controls" hidden>
        <div id="gps-status" class="gps-status" data-i18n="gps.off">GPS off</div>
        <button id="loc-help-btn" class="help-btn" hidden>How do I allow location?</button>
        <div class="row">
          <button id="corner-btn" class="primary" data-i18n="walk.corner">📍 Mark corner</button>
          <button id="trace-btn" data-i18n="walk.traceStart">〰️ Start tracing</button>
        </div>
        <p class="hint" data-i18n-html="walk.hint"></p>
      </div>

      <div id="draw-controls" class="controls" hidden>
        <p class="hint" data-i18n-html="draw.hint"></p>
        <p class="hint" data-i18n-html="draw.trees"></p>
      </div>

      <div id="parcel-controls" class="controls" hidden>
        <p class="hint" data-i18n-html="parcel.hint"></p>
      </div>

      <div class="row actions">
        <button id="undo-btn" data-i18n="undo">↶ Undo</button>
        <button id="clear-btn" data-i18n="clear">✕ Clear all</button>
        <button id="export-btn" data-i18n="export">⇩ GeoJSON</button>
      </div>

      <div class="row save-row">
        <input id="name-input" type="text" data-i18n-placeholder="save.placeholder" placeholder="Name this garden" maxlength="60" />
        <button id="save-btn" data-i18n="save">💾 Save</button>
      </div>

      <details id="saved">
        <summary><span data-i18n="saved.title">Saved gardens</span> (<span id="saved-count">0</span>)</summary>
        <ul id="saved-list"></ul>
      </details>

      <div class="row footer">
        <label><span data-i18n="units">Units</span>
          <select id="units">
            <option value="metric" data-i18n="units.metric">Metric (m²)</option>
            <option value="imperial" data-i18n="units.imperial">Imperial (ft²)</option>
          </select>
        </label>
        <label><span data-i18n="lang">Language</span>
          <select id="lang">
            <option value="en">English</option>
            <option value="fr">Français</option>
          </select>
        </label>
        <span class="muted" data-i18n="privacy">Data stays on this device.</span>
      </div>
    </section>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script type="module" src="app.js"></script>
  </body>
</html>
